[package]
name = "jpeg_snapshot"
description = "HTTP JPEG snapshot server (Rust port of jpeg_snapshot/main.c)"
version.workspace = true
edition.workspace = true
license.workspace = true
# Nothing here is published; these crates only make sense next to the
# vendored SDK and the camera's toolchain.
publish = false

[dependencies]
clap.workspace = true
anyka.workspace = true
telemetry.workspace = true
eyre.workspace = true
tracing.workspace = true
metrics.workspace = true

[build-dependencies]
anyka-link.workspace = true

[[bin]]
name = "jpeg_snapshot"
path = "src/main.rs"
