[package]
name = "aenc_demo"
description = "Audio encoding to MP3/AAC/AMR/G.711/PCM (Rust port of ak_aenc_demo.c)"
version.workspace = true
edition.workspace = true
license.workspace = true
# Nothing here is published; these crates only make sense next to the
# vendored SDK and the camera's toolchain.
publish = false

[dependencies]
clap.workspace = true
anyka.workspace = true
telemetry.workspace = true
eyre.workspace = true
tracing.workspace = true
metrics.workspace = true

[build-dependencies]
anyka-link.workspace = true

[[bin]]
name = "aenc_demo"
path = "src/main.rs"
