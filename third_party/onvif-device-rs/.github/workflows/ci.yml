name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene gate (junk/secret files must not be tracked)
        run: tools/check-repo-hygiene.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # The `tls` feature gates real code paths (tokio-rustls listener +
      # rustls-pemfile loading + tests/server_tls.rs) — clippy and test it
      # in CI or it silently rots uncompiled.
      - name: Clippy (tls feature)
        run: cargo clippy --all-targets --features tls -- -D warnings
      - name: Test
        run: cargo test
      - name: Test (tls feature)
        run: cargo test --features tls

  msrv:
    # The rust-version field is a resolver contract for downstreams —
    # verify the crate actually builds on it (issue #3).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build

  windows-check:
    # Non-Unix targets must keep compiling (sibling repo issue pattern,
    # gb28181-rs#4): check-only, no linking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Check Windows target
        run: cargo check --target x86_64-pc-windows-msvc

  coverage:
    # Line coverage via cargo-llvm-cov (issue #21, aligned with
    # gb28181-rs#33), gated at 85% lines (measured baseline ~94%).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --summary-only --fail-under-lines 85

# workflow touch to re-register triggers after the push-event outage
