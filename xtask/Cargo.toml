[package]
name = "xtask"
description = "Build and packaging tasks for the Anyka camera workspace"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: xtask builds for the host, while the crates next to it
# cross-compile to ARMv5TE through .cargo/config.toml.
[workspace]

[dependencies]
eyre = "0.6"
# `./x check-boards` validates boards/*.toml with the same code the services
# use. Host-safe: serde/toml only, no SDK.
board = { path = "../crates/board" }

# `./x gen-onvif` (src/gen_onvif.rs): the ONVIF type generator. Host-only on
# purpose: xsd-parser and its ~80 crates stay out of every camera build, which
# only needs the generated code and `xsd-parser-types` (see onvif-schema).
# Exact pins, because the committed output in crates/onvif-schema/src/generated must
# not change under a semver-compatible update; bump them together, regenerate
# and review the diff. `xsd-parser-types` must match onvif-schema's pin.
xsd-parser = "=1.5.2"
xsd-parser-types = "=0.2.1"
# Same proc-macro2/quick-xml/url as xsd-parser uses, so nothing is built twice.
proc-macro2 = "1"
quick-xml = "0.38"
roxmltree = "0.21"
url = "2"

# `./x kup` (src/kup.rs): builds and signs the OTA update package. The
# manifest types, canonical JSON and signature check come from the same crate
# the camera's updater uses, so what xtask signs is what the device verifies.
ota-manifest = { path = "../crates/ota-manifest" }
# Reproducible payload archives: tar entries written with fixed headers, gzip
# through flate2's default pure-Rust backend (miniz_oxide), as on the camera.
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1"
sha2 = "0.10"
# Repository name for the release notes link, from cliff.toml. Same version
# as the board crate, so the lockfile keeps one toml.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 1
