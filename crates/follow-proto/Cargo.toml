[package]
name = "follow-proto"
description = "Wire protocol and async client for the PTZ follow-movement control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Like ptz-proto and lights-proto: only the protocol, so web can be a client
# without linking the tracker.
[dependencies]
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokio = { version = "1", features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
