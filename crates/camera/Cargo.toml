[package]
name = "camera"
description = "Camera core: capture backend/encoder traits, the snapshot, /status and video-socket service, JPEG and a test-pattern backend (no device access)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Board-agnostic: no device node, no ioctl, no SDK. Hardware backends
# (anyka-av100) implement `backend` in their own crates; the `camera`
# binary lives in camerad.
[dependencies]
video-proto.workspace = true
tracing.workspace = true
metrics.workspace = true
serde.workspace = true
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time", "signal", "sync"] }

[features]
# `camera::fake` (scripted backend + encoder) for other crates' tests.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
