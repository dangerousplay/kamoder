# git-cliff configuration: https://git-cliff.org/docs/configuration
#
#   git cliff -o CHANGELOG.md            full changelog
#   git cliff --unreleased --tag v0.2.0  notes for the next release
#
# Commits follow Conventional Commits (feat:, fix:, docs:, ...). Release
# candidates (vX.Y.Z-rc.N) are ignored as boundaries, so a final release lists
# everything since the previous final release.

[remote.github]
owner = "dangerousplay"
repo = "kamoder"

[changelog]
header = """
# Changelog

All notable changes to Kamoder. Generated by [git-cliff](https://git-cliff.org).\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous.version %}({{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}){% else %}({{ self::remote_url() }}/releases/tag/{{ version }}){% endif %} \
- {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
# Release candidates are not changelog boundaries.
ignore_tags = "v.*-rc\\..*"
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Drop trailers such as Co-Authored-By from the rendered message.
  { pattern = "\n\n(?s:.*)$", replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->🚜 Refactor" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^(ci|build)", group = "<!-- 5 -->⚙️ Build & CI" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^security", group = "<!-- 7 -->🛡️ Security" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 8 -->🧹 Chores" },
  { body = ".*security", group = "<!-- 7 -->🛡️ Security" },
  { message = ".*", group = "<!-- 9 -->📦 Other" },
]
