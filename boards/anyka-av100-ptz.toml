# AK3918AV100 pan/tilt camera with two SC2331 sensors (vendor board
# EVB_CBDM_KM01N), the unit this project was developed on. Every value here
# is what the services used as built-in defaults before board profiles
# existed; change them only with a live test on this board.
name = "anyka-av100-ptz"
description = "AK3918AV100 dual SC2331 pan/tilt (EVB_CBDM_KM01N)"

[match]
# The 3.4 kernel has no device tree; cpuinfo is the only SoC identity.
cpuinfo_hardware = "AK3918AV100"

[platform]
# Stopped by init.sh before the Rust services start. `ipc` holds
# /dev/watchdog, hence watchdog_wait.
vendor_processes = ["daemon", "gwellupdater.sh", "soft_reboot.sh", "ipc", "anyka_ipc", "main"]
watchdog_wait = true

[video]
backend = "anyka-av100"
# Dual mode: both sensors must be started together (HARDWARE-FINDINGS).
sensors = [0, 1]
tuning_dir = "/usr/local"

[video.stream]
width = 1280
height = 720
fps = 15
kbps = 2048
gop = 30
profile = "main"

[video.snapshot]
# Snapshots come from the 1280x720 capture, halved while wider than this.
max_width = 640
quality = 80

# Sysfs numbers, live-confirmed on this board. `lights` may write these five
# and nothing else; it refuses to start if one equals wifi.power_gpio.
[lights]
gpio_root = "/sys/class/gpio"

# Held level: low = IR-cut filter in (day), high = out (night).
[[lights.line]]
role = "ir_cut"
gpio = 19
active_low = false

[[lights.line]]
role = "ir_leds"
gpio = 67
active_low = false

[[lights.line]]
role = "white"
gpio = 68
active_low = false

# Red and blue lights: lit from boot while the pin floats, which is why
# lights starts early and never unexports its lines.
[[lights.line]]
role = "alarm"
gpio = 48
active_low = false

# Speaker amplifier enable: high = muted.
[[lights.line]]
role = "amp"
gpio = 37
active_low = true

# The ak_pcm.ko codec: ALSA-style node names but a vendor char device
# (major 248, no /dev/snd). Live-tested 2026-10-17 with pcm-probe: capture
# runs natively at 8 kHz mono S16 (512 B periods, 32 ms reads, real signal),
# the same 8 kHz as the wire format, so nothing is resampled. Gain ranges:
# DAC 0-6 per the SDK (0 = mute); ADC range unverified, driver default 3.
[audio]
backend = "ak-pcm"
rate = 8000

[[audio.input]]
id = "mic0"
name = "Microphone"
device = "/dev/pcmC0D0c"
gain = 3
gain_range = [0, 7]

[[audio.output]]
id = "spk0"
name = "Speaker"
device = "/dev/pcmC0D0p"
gain = 4
gain_range = [0, 6]

[wifi]
iface = "wlan0"
module = "/ipc/modules/wifi/ssv6x5x.ko"
module_args = ["stacfgpath=/ipc/modules/wifi/ssv6x5x-wifi.cfg"]
# USB power of the SSV6x5x module; the Wi-Fi recovery power-cycles it.
power_gpio = 98

[ptz]
backend = "preset_motor"
device = "/dev/preset_motor"
# Patched driver shipped with the vendor firmware.
module = "/ipc/patch/ko/presetmotor.ko"
pan = [0, 175]
tilt = [0, 70]
steps_per_degree = 1.0

# Motion following (only boards with a [ptz] head get this table). Every key
# is optional and an empty table enables following with the built-in
# defaults; delete the table to turn the feature off for this board. The
# values below are those defaults, written out to be tuned on hardware:
# fov_deg was never measured on this unit, and t_on/t_off are in the ISP's
# u16 per-cell motion-energy units.
[ptz.follow]
hz = 10
dead_zone_permille = [300, 400]
max_step_deg = 15.0
fov_deg = [90.0, 50.0]
decision_frames = 5
settle_ms = 300
return_after_s = 15
manual_hold_s = 60
t_on = 600
t_off = 300
min_cells = 2
max_fraction_permille = 600
# home = [87.5, 35.0]   # unset = return to the PTZ home
